pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
		maven {
			name = 'Stonecutter'
			url = "https://maven.kikugie.dev/snapshots"
		}
	}
}

plugins {
	id "dev.kikugie.stonecutter" version "0.7.10"
}

stonecutter {
	create(rootProject) {
		kotlinController = false
		centralScript = "build.gradle"

		versions "1.20", "1.21.2", "1.21.9"
		vcsVersion = "1.20"
	}
}
